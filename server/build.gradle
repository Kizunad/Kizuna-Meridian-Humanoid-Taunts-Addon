description = '类人垃圾话台词表、发言记忆与配置的纯 Java 规则。'

dependencies {
    // Gson 由 Minecraft 1.20.1 运行时提供，那里是 2.10，不能用 2.10.1 新增的 API；TOML 库随 Fabric JAR 嵌套。
    compileOnly libs.gson
    implementation libs.tomlj
    testImplementation project(':shared')
    // 七种生人的实体 ID 以 Threatening 内置物种为准；两者在 settings 中以源码组合，只取模块本身。
    testImplementation('local.meridian:server') { transitive = false }
    testImplementation('dev.kizuna.meridian.humanoid:server') { transitive = false }
    testImplementation libs.gson
    testImplementation libs.junit4
}

test {
    useJUnit()
}
