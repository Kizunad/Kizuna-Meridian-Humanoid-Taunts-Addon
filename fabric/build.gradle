plugins { id 'net.fabricmc.fabric-loom' }

description = '类人受击垃圾话：Damage 观察方、聊天与头顶气泡、调试命令。'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    // Threatening 以源码组合进来，完整装配按坐标装入它的 fabric 模块，连带它 include 的寻路核心；
    // 寻路核心只在 Pathfinding 仓的 core/build/libs，与 Threatening 自己的 flatDir 同一位置。
    flatDir { dirs new File(kizunaWorkspace.directory('pathfinding'), 'core/build/libs') }
}

dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api

    implementation project(':server')
    include project(':server')
    // 版本目录条目是 Provider，implementation 不返回依赖对象，嵌套声明单独写。
    implementation libs.tomlj
    include libs.tomlj
    include libs.antlr.runtime
    // 物种来自 Threatening，受击事实来自 Damage 观察事件，调试指令挂在 Framework 的 /meridian 注册点；
    // 三者都是必装模组，运行时由完整装配提供。相邻仓库在 settings 中以源码组合，与原先读单个 JAR 一致只取各模块本身。
    compileOnly('dev.kizuna.meridian.vanilla:fabric') { transitive = false }
    compileOnly('dev.kizuna.meridian:fabric') { transitive = false }
    compileOnly('dev.kizuna.meridian.vanilla:server') { transitive = false }
    compileOnly('local.meridian:server') { transitive = false }
    compileOnly('dev.kizuna.meridian.humanoid:server') { transitive = false }
    compileOnly libs.protobuf.java
    testImplementation libs.junit4
}

test { useJUnit() }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    // 台词数据只在 shared 维护一份，随正式 JAR 根目录发布。
    from(project(':shared').sourceSets.main.resources)
}

// 开发运行沿用 Meridian 统一完整装配；Framework 与 Protobuf 在安装 JAR 中是嵌套库，开发时显式补齐。
// Human 客户端库只在客户端测试运行时需要，按装配清单读已构建的 JAR。
apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')
dependencies {
    localRuntime('local.meridian:server') { transitive = false }
    localRuntime libs.protobuf.java
    localRuntime files(kizunaWorkspace.artifact('human', 'client', false))
}

loom {
    mods {
        meridian_humanoid_taunts { sourceSet sourceSets.main }
    }
    runs {
        client { runDir 'build/playtest' }
        server { runDir 'build/server' }
    }
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    clientTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        meridian_humanoid_taunts_test { sourceSet sourceSets.gametest }
        meridian_humanoid_taunts_client_test { sourceSet sourceSets.clientTest }
    }
    runs {
        gametest {
            server()
            name '类人垃圾话 GameTest'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
        clientTest {
            client()
            name '类人垃圾话气泡客户端测试'
            source sourceSets.clientTest
            runDir 'build/clienttest'
            programArgs '--quickPlaySingleplayer', 'taunts-bubble-test', '--width', '1280', '--height', '960'
        }
    }
}

afterEvaluate {
    tasks.named('runGametest') {
        doFirst {
            // GameTest 服务端按自带的平坦预设建世界（不读 level-type），客户端测试复用这份世界；固定端口与视距避免占用用户环境。
            def runDirectory = file('build/gametest')
            runDirectory.mkdirs()
            // 每局从空目录新建世界：GameTest 服务端按自带的平坦预设建世界，旧目录只会累积上一局的区块、实体、假玩家与模组存档。
            // 26.2 把生成设置与游戏规则拆到了 data/minecraft，只留 level.dat 会退回随机种子的默认地形，所以整个目录删掉。
            new File(runDirectory, 'world').deleteDir()
            new File(runDirectory, 'eula.txt').text = 'eula=true\n'
            new File(runDirectory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
generate-structures=false
view-distance=2
simulation-distance=2
'''
        }
    }
}

// 客户端验收只取 GameTest 世界的全局存档：level.dat（数据包等）与 data/minecraft（平坦生成设置、游戏规则、天气与时钟），
// 不带区块、实体与模组存档，GameTest 遗留的结构不会进入截图背景；每次都重新同步，上一局的玩家位置和村民不留到下一局。
// 26.2 的生成设置不在 level.dat 里，缺了 data/minecraft/world_gen_settings.dat 就不是原来的平坦世界。
tasks.register('prepareClientTestWorld', Sync) {
    from(layout.buildDirectory.dir('gametest/world')) {
        include 'level.dat', 'data/minecraft/**'
    }
    into layout.buildDirectory.dir('clienttest/saves/taunts-bubble-test')
    outputs.upToDateWhen { false }
}
tasks.named('runClientTest') {
    dependsOn tasks.named('prepareClientTestWorld')
    def report = layout.buildDirectory.file('clienttest-results.txt')
    def options = layout.buildDirectory.file('clienttest/options.txt')
    doFirst {
        report.get().asFile.text = 'success=false\n'
        // 以简体中文启动，聊天里的实体名按中文语言文件解析；4903 是 26.2 的数据版本，免得选项走升级。
        // 26.2 首次启动先弹无障碍引导，挡住 quickPlay 进不了世界，所以每次都标记为已引导。
        options.get().asFile.parentFile.mkdirs()
        options.get().asFile.text = 'version:4903\nlang:zh_cn\nonboardAccessibility:false\n'
    }
    doLast {
        if (!report.get().asFile.text.startsWith('success=true')) {
            throw new GradleException("气泡客户端验收失败：${report.get().asFile}")
        }
    }
}
